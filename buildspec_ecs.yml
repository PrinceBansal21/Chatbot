version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR container registry..."
      - aws ecr get-login-password --region ${CLOUD_REGION:-$AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${CONTAINER_REGISTRY_URL:-${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com}
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:-${COMMIT_HASH:-latest}}
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-aws}
      - if [ "$CLOUD_PROVIDER" != "aws" ] && [ "$CLOUD_PROVIDER" != "azure" ]; then echo "Unsupported CLOUD_PROVIDER=$CLOUD_PROVIDER"; exit 1; fi
      - echo "Cloud Provider set to $CLOUD_PROVIDER"
      # Attempt to read GitHub token from Secrets Manager (for private deps)
      - |
        if GITHUB_TOKEN_JSON=$(aws secretsmanager get-secret-value --secret-id "win-suite/prod/github-pat" --query SecretString --output text 2>/dev/null); then
          export GITHUB_TOKEN=$(echo "$GITHUB_TOKEN_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('token', d.get('GITHUB_TOKEN', '')))" 2>/dev/null || echo "$GITHUB_TOKEN_JSON")
        fi
      # Pull the previous image to use as Docker layer cache (speeds up rebuilds)
      - echo "Pulling previous image for layer cache..."
      - docker pull $REPOSITORY_URI:latest || true
  build:
    commands:
      - echo 'Build started on '$(date)''
      - echo 'Building the Docker image for ECS with CLOUD_PROVIDER='$CLOUD_PROVIDER'...'
      - cd pipeline
      - docker build --cache-from $REPOSITORY_URI:latest --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg CLOUD_PROVIDER=$CLOUD_PROVIDER --build-arg GITHUB_TOKEN=$GITHUB_TOKEN -f Dockerfile --platform linux/arm64 -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo 'Build completed on '$(date)''
      - echo Verifying LibreOffice is installed in the Docker image...
      - docker run --rm $REPOSITORY_URI:latest sh -c "which soffice && soffice --version" || (echo "ERROR - LibreOffice is NOT installed in the Docker image. PPTX conversion will fail." && exit 1)
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Updating ECS Service...
      - aws ecs update-service --cluster $ECS_CLUSTER_NAME --service $ECS_SERVICE_NAME --force-new-deployment
